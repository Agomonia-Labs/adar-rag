services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       docintel
      POSTGRES_USER:     docintel
      POSTGRES_PASSWORD: docintel_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 5s
      timeout:  5s
      retries:  10

  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docintel:docintel_secret@postgres:5432/docintel
      GCS_SERVICE_ACCOUNT_KEY_PATH: /app/gcs-key.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - /tmp:/tmp
      - ./gcs-key.json:/app/gcs-key.json:ro

  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: