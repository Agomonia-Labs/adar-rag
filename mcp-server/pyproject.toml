[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintel-mcp"
version = "0.1.0"
description = "Governed MCP gateway for the ADAR DocIntel knowledgebase"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
docintel-mcp = "docintel_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

